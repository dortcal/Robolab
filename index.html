:root{--ink:#2B1A16;--bg:#BFE6DC;--paper:#FFFDFA;--amarillo:#FFC21A;--coral:#FF6A4D;--mar:#1F86C8;--monte:#2E9D68;--lava:#D8392B;--r:16px;--fs:18px}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:700;line-height:1.35;min-height:100vh}
body.grande{--fs:22px}
h1,h2,.btn,.t,.rep,.g{font-family:Fredoka,Nunito,sans-serif;font-weight:600}
h1{font-size:1.5rem;margin:0;flex:1;text-align:center}
h2{font-size:1.1rem;margin:.4rem 0}
#app{max-width:980px;margin:0 auto;padding:10px 12px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.btn{font-size:1rem;min-height:48px;min-width:48px;padding:8px 18px;border:3px solid var(--ink);border-radius:var(--r);background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s,background .12s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 2px 0 var(--ink)}
.btn.gr{background:var(--amarillo)}
.btn.peq{min-height:44px;padding:6px 12px;font-size:.9rem}
.btn[aria-pressed=true]{background:var(--monte);color:#fff}
:focus-visible{outline:4px solid var(--mar);outline-offset:3px}
.btn:focus-visible,.hot:focus-visible,.card:focus-visible,.barra:focus-visible{outline:4px solid var(--ink);outline-offset:3px;box-shadow:0 0 0 7px var(--amarillo)}
.lead{text-align:center;font-size:1.05rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:16px 0}
.card{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:16px;border:3px solid var(--ink);border-radius:20px;background:var(--paper);box-shadow:0 5px 0 var(--ink);cursor:pointer;font:inherit;color:inherit;min-height:120px}
.card .t{font-size:1.25rem}.card .q{font-size:.9rem;text-transform:none}
.estrellas{display:inline-flex;gap:2px}.est{width:28px;height:28px;fill:#EAD9C8;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}.est.on{fill:var(--amarillo)}
.nota{font-size:.85rem;opacity:.85}
.escena{position:relative;border:3px solid var(--ink);border-radius:20px;overflow:hidden;background:#BFE6DC;box-shadow:0 5px 0 var(--ink)}
.escena svg{display:block;width:100%;height:auto}
.hot{position:absolute;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:var(--amarillo);font:600 1.3rem Fredoka,sans-serif;color:var(--ink);cursor:pointer;animation:lat 1.8s ease-in-out infinite}
.hot.ok{background:var(--monte);color:#fff;animation:none}
@keyframes lat{50%{transform:translate(-50%,-50%) scale(1.12)}}
.burbuja{margin:12px 0;padding:12px 16px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;font-size:1.05rem}
.datos{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
.datos li{padding:8px 12px;border:2px dashed var(--ink);border-radius:12px;background:rgba(255,253,250,.5);font-size:.95rem}
.datos li.on{border-style:solid;background:var(--paper)}
.acc{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}
.dis{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:14px;align-items:start}
.stage{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:6px}.stage svg{width:100%;height:auto;display:block}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.col{display:flex;flex-direction:column;gap:8px}
.pz{width:100%;text-align:center}
.ficha{margin:10px 0;padding:10px 14px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;min-height:3.2em}
.pred .fila,.fila{display:flex;gap:10px;flex-wrap:wrap}.fila .btn{width:auto;flex:1 1 170px}
.prog{display:flex;gap:10px;align-items:stretch;margin:12px 0}
.tira{flex:1;min-height:64px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;background:var(--paper);border:3px solid var(--ink);border-radius:16px}
.cont{align-self:center;white-space:nowrap}
.step{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;border:3px solid var(--ink);border-radius:12px;background:#FFF4D6;font:600 1.4rem Fredoka,sans-serif;transition:transform .15s,background .15s}
.step.on{background:var(--amarillo);transform:scale(1.2)}
.bucle{display:inline-flex;gap:4px;align-items:center;padding:4px 6px;border:3px solid var(--coral);border-radius:14px;background:#FFE4DC}
.bucle.act,.rama.act{box-shadow:0 0 0 4px var(--amarillo)}
.bucle{flex-wrap:wrap}.dentro{display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap}
.cond{display:inline-flex;gap:6px;align-items:center;padding:4px 6px;border:3px solid var(--mar);border-radius:14px;background:#D7EEFB}
.ramas{display:flex;flex-direction:column;gap:4px}
.rama{display:flex;gap:6px;align-items:center;padding:2px 6px;border-radius:10px;background:#F3FAFE;border:2px dashed var(--mar)}
.rama .et{font:700 .8rem Nunito,sans-serif;min-width:4.6em}
.ord.rp.si{background:#D7EEFB}
.rep{font-size:.9rem;margin-right:2px}
.vacia{opacity:.7}
.pal{display:flex;gap:8px;flex-wrap:wrap}
.ord{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 10px;min-width:64px;min-height:56px}
.ord .g{font-size:1.5rem;line-height:1}.ord .n{font-size:.75rem}
.ord.rp{background:#FFE4DC}
.res .ok{padding:12px 16px;background:#D5F2DF;border:3px solid var(--monte);border-radius:16px}
.res .mal{padding:12px 16px;background:#FFE9C7;border:3px solid var(--ink);border-radius:16px}
.res p{margin:.3rem 0}
.np{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:0 8px;margin-right:6px;font-size:.85rem}
.graf{display:flex;gap:14px;align-items:flex-end;justify-content:center;min-height:260px;padding:16px;background:var(--paper);border:3px solid var(--ink);border-radius:20px}
.barra{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;width:84px;min-height:44px;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.barra .b{display:block;width:100%;height:var(--h);background:var(--mar);border:3px solid var(--ink);border-radius:12px 12px 4px 4px;transition:transform .15s}
.barra:hover .b{transform:scaleY(1.03)}
.barra[aria-pressed=true] .b{background:var(--amarillo)}
.barra .v,.barra .e{font-family:Fredoka,sans-serif;font-weight:600}
.stars{text-align:center;margin:8px 0}.stars .est{width:56px;height:56px}
.criterios{list-style:none;padding:0;display:grid;gap:6px}
.criterios li{padding:8px 12px;border:2px dashed var(--ink);border-radius:12px}
.criterios li::before{content:'○ ';font-weight:800}
.criterios li.on{border-style:solid;background:var(--paper)}.criterios li.on::before{content:'★ '}
.frases{display:grid;gap:8px}.fr{text-align:left}
.pop{animation:pop .4s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.calm .par,.calm .fogA,.calm .drop{animation-play-state:paused}
.vista{animation:ent .25s ease-out}
@keyframes ent{from{opacity:0;transform:translateY(6px)}}
.nomotion *,.nomotion *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
.sr{position:absolute;left:-9999px}
@media (max-width:640px){h1{font-size:1.15rem}.dis{grid-template-columns:1fr}.stage{max-width:200px;margin:0 auto}.top .btn.peq{padding:6px 10px}.cont{display:none}.prog{display:block}}
@media (prefers-contrast:more){.btn,.card{border-width:4px}}

.hoja{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:16px}
.hoja .tit{text-align:left;font-size:1.4rem}.nom{margin:.6rem 0}
.im{border-top:2px dashed var(--ink);padding:8px 0}.im .er{background:#FFE9C7;border-radius:10px;padding:6px 10px}.crit{font-size:.85rem}
@media print{body{background:#fff}.noprint,#estado{display:none!important}.hoja{border:0;padding:0}.est{width:20px;height:20px}.im{break-inside:avoid}}
.guia{margin:10px 0 0;font-size:.95rem}
/* Animaciones de los dibujos SVG */
.spin,.sway,.blink,.claw1,.claw2,.fogA{transform-box:fill-box;transform-origin:center}
.spin{animation:giro 4s linear infinite}
.sway{transform-origin:50% 100%;animation:mece 3s ease-in-out infinite}
.blink{animation:parpadeo 4.5s infinite}
.claw1{transform-origin:0 50%;animation:pinza1 2.4s ease-in-out infinite}.claw2{transform-origin:0 50%;animation:pinza2 2.4s ease-in-out infinite}
.fogA{animation:niebla 14s ease-in-out infinite alternate}
.drop{animation:gota 1.1s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
@keyframes mece{50%{transform:rotate(3deg)}}
@keyframes parpadeo{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes pinza1{50%{transform:rotate(-8deg)}}@keyframes pinza2{50%{transform:rotate(8deg)}}
@keyframes niebla{to{transform:translateX(60px)}}
@keyframes gota{from{transform:translateY(-20px);opacity:0}30%{opacity:1}to{transform:translateY(380px);opacity:0}}
/* Edición del programa: huecos, bloques marcados y arrastre */
button.step,button.rep{font:600 1.4rem Fredoka,sans-serif;color:var(--ink);cursor:grab;padding:0 6px;touch-action:none;user-select:none;-webkit-user-select:none}
button.rep{border:0;background:none;font-size:.9rem;min-height:44px}
.blk:disabled{opacity:1;cursor:default}
.blk.sel{outline:4px solid var(--mar);outline-offset:2px;border-radius:12px;background:#D7EEFB}
.slot{position:relative;min-width:30px;min-height:48px;padding:0;border:0;background:none;cursor:pointer;flex:0 0 auto}

(function(RL){RL.curriculo={"fuente": "Decreto 211/2022, de 10 de noviembre (BOC n.º 231, 23/11/2022), Anexo, Conocimiento del Medio Natural, Social y Cultural", "consulta": "12/11/2026", "estado": "Verificada en fuente; vigencia sin confirmar en Juriscan", "ciclos": {"2": {"criterios": {"1.1": "Utilizar dispositivos y recursos digitales, de forma segura, responsable, saludable y sostenible, de acuerdo con las necesidades del contexto educativo, para realizar búsquedas guiadas de información, respetando la propiedad intelectual; para comunicarse en plataformas digitales restringidas y seguras, compartiendo datos y usando la terminología científica básica, y para trabajar cooperativamente, respetando la privacidad y protección del entorno digital de aprendizaje.", "1.2": "Reelaborar y crear contenidos digitales sencillos, con diferentes medios, soportes y formatos, trabajando de forma individual y en equipo, para construir, comunicar y compartir nuevos conocimientos, respetando los derechos de autoría y de acuerdo a las necesidades digitales del contexto educativo.", "2.1": "Formular preguntas y realizar predicciones razonadas, demostrando curiosidad por el medio natural, social y cultural canario, participando en interacciones comunicativas con actitud cooperativa e interpretando el sentido de textos orales y multimodales.", "2.2": "Buscar, seleccionar y comprender información de diferentes fuentes seguras y fiables, adquiriendo léxico científico básico, y utilizándola en investigaciones relacionadas con el medio natural, social y cultural, reconociendo el valor de la ciencia en Canarias.", "2.3": "Realizar experimentos guiados utilizando diferentes técnicas de indagación y modelos, empleando de forma segura instrumentos y dispositivos, realizando observaciones y mediciones precisas, y registrándolas correctamente en distintos formatos.", "2.4": "Proponer posibles respuestas a las preguntas planteadas, en diversos textos, a través de la interpretación de la información y los resultados obtenidos, comparándolos con las predicciones realizadas.", "2.5": "Comunicar los resultados de las investigaciones en diferentes formatos, utilizando lenguaje científico básico y explicando los pasos seguidos, adoptando un punto de vista creativo y personal.", "3.1": "Construir, en equipo, de forma empática e inclusiva, un producto final sencillo que dé respuesta a un problema de diseño, proponiendo posibles soluciones creativas, utilizando de forma segura las herramientas, las técnicas y los materiales adecuados, y probando diferentes prototipos.", "3.2": "Resolver, de forma guiada y empleando estrategias cooperativas, problemas sencillos y sostenibles de programación, modificando algoritmos, de acuerdo con los principios básicos del pensamiento computacional.", "3.3": "Comunicar el producto final de los proyectos de diseño en diferentes formatos, asumiendo las responsabilidades individuales asignadas en el trabajo en grupo, explicando los pasos seguidos, y autoevaluando y coevaluando el proceso realizado y el resultado obtenido.", "4.1": "Desarrollar, de forma guiada, actitudes que fomenten el bienestar físico, emocional y social, a través de la conciencia, la regulación y la vinculación emocional, y del establecimiento de relaciones afectivas saludables, inclusivas y corresponsables, potenciando la cultura de los cuidados.", "4.2": "Desarrollar estilos de vida saludables, valorando la importancia de una alimentación variada, equilibrada y sostenible, la higiene, el ejercicio físico, el contacto con la naturaleza, el descanso y cuidado del cuerpo y el uso adecuado de las tecnologías, participando en acciones fundamentadas científicamente para preservar la salud.", "5.1": "Identificar las características, la organización y las propiedades de los elementos del medio natural, social y cultural, partiendo del reconocimiento de la biodiversidad del archipiélago canario, a través de la indagación y la búsqueda guiada de información, utilizando las herramientas y los procesos adecuados para transmitir y compartir los conocimientos en diferentes formatos.", "5.2": "Identificar conexiones sencillas entre diferentes elementos del medio natural social y cultural, partiendo del reconocimiento de la formación de las islas Canarias, para comprender las relaciones que se establecen en los ecosistemas canarios y acercarse así a las que ocurren en otros lugares.", "5.3": "Proteger el patrimonio cultural y el natural, especialmente de Canarias, para valorarlos como un bien común, adoptando conductas respetuosas para su disfrute y proponiendo acciones para su conservación y mejora.", "6.1": "Poner en práctica estilos de vida sostenibles, reconociendo comportamientos respetuosos de cuidado, corresponsabilidad y de protección del entorno, así como un uso sostenible del agua, la energía, los residuos y los recursos naturales, expresando los cambios positivos y negativos causados en el medio por la acción humana, y explicando algunos fenómenos que ocurren a su alrededor, para potenciar un modelo de isla sostenible para Canarias.", "6.2": "Identificar problemas ecosociales en el entorno cercano, compartidos a nivel mundial, y proponer posibles soluciones, de manera individual y cooperativa, para poner en práctica estilos de vida sostenibles.", "7.1": "Localizar, seleccionar e identificar hechos del entorno social y cultural, desde la Prehistoria hasta la Edad Antigua, empleando las nociones de causalidad, simultaneidad y sucesión, para comunicarlos, adoptando un punto de vista creativo.", "7.2": "Reconocer personas, grupos sociales relevantes y formas de vida de las sociedades, desde la Prehistoria hasta la Edad Antigua, visibilizando las aportaciones y representación de las mujeres en ellas y de personajes históricos representativos en Canarias.", "8.1": "Analizar la importancia demográfica, cultural y económica de las migraciones en la actualidad, demostrando respeto y empatía por el aporte de la diversidad cultural al bienestar individual y colectivo, especialmente en la sociedad canaria.", "8.2": "Reconocer y valorar las acciones y actividades comunitarias que fomentan la igualdad efectiva entre mujeres y hombres, así como las conductas no sexistas, reconociendo modelos positivos a lo largo de la historia, empleando estrategias colaborativas para reflexionar y comunicar sobre problemas éticos de actualidad.", "9.1": "Realizar actividades en el contexto de la comunidad escolar, asumiendo responsabilidades, estableciendo acuerdos democráticos y empleando un lenguaje inclusivo y no violento.", "9.2": "Reconocer los principales órganos de gobierno, incluyendo los ayuntamientos y cabildos insulares en Canarias, y las funciones de las diversas administraciones y de los servicios públicos, reflexionando sobre la importancia de su gestión para la seguridad integral ciudadana y la participación democrática.", "9.3": "Participar en actividades comunitarias, de manera constructiva e inclusiva, para interiorizar normas básicas para la convivencia en el uso de los espacios públicos como peatones o como personas usuarias de los medios de locomoción, identificando las señales de tráfico y tomando conciencia de la importancia de una movilidad segura, saludable y sostenible, tanto para las personas como para el planeta."}, "saberes": {"I.1.1": "Iniciación a la investigación científica (observación en el tiempo, identificación y clasificación, búsqueda de patrones, creación de modelos, investigación guiada a través de búsqueda de información, experimentos pautados con control de variables…).", "I.1.2": "Fomento de la curiosidad, la iniciativa y la constancia en la realización de las diferentes investigaciones contextualizadas en el medio natural, social y cultural de Canarias, a partir de estrategias cooperativas.", "I.1.3": "Manipulación de instrumentos, dispositivos y herramientas digitales apropiados para realizar observaciones y mediciones, de acuerdo con las necesidades de la investigación.", "I.1.4": "Identificación de vocabulario científico básico relacionado con las diferentes investigaciones para comunicar y construir nuevos conocimientos, reconociendo la importancia de la ciencia en Canarias.", "I.1.5": "Reconocimiento de los avances en el pasado relacionados con la ciencia y la tecnología que han contribuido a transformar nuestra sociedad, visibilizando la aportación histórica de las mujeres.", "I.1.6": "Valoración del uso de la ciencia y la tecnología para ayudar a comprender las causas de las propias acciones, tomar decisiones razonadas y realizar tareas de forma más eficiente.", "I.2.1": "Reconocimiento de los reinos de la naturaleza desde una perspectiva general e integrada, valorando la biodiversidad, a partir del estudio y análisis de las características de diferentes ecosistemas, sus funciones y servicios como lugar donde intervienen factores bióticos y abióticos, manteniéndose un equilibrio entre los diferentes elementos y recursos.", "I.2.2": "Comprensión del carácter excepcional de la biodiversidad canaria: conceptos básicos (endemismo y autoctonismo) e introducción a los ecosistemas canarios (fondos rocosos, sebadal, matorral costero, termófilo, monteverde, jaral, pinar, matorral de cumbre...).", "I.2.3": "Identificación de las características propias de los animales y de las plantas que permiten su clasificación y diferenciación en subgrupos relacionados con su capacidad adaptativa al medio: obtención de energía, relación con el entorno y perpetuación de la especie. Reconocimiento e identificación de las especies animales y vegetales más representativas de Canarias.", "I.2.4": "Identificación de la relación del ser humano con los ecosistemas para cubrir las necesidades de la sociedad. Ejemplos de buenos y malos usos de los recursos naturales de nuestro planeta, especialmente en nuestro archipiélago canario, y sus consecuencias.", "I.2.5": "Identificación de las formas de relieve más relevantes y clasificación elemental de las rocas. Reconocimiento de las particularidades geológicas de la formación de las islas Canarias con respecto a otros procesos geológico y de los volcanes principales de Canarias.", "I.2.6": "Valoración del agua como elemento imprescindible para la vida: hidrosfera, aguas subterráneas, ciclo del agua, uso, formas de ahorro y consumo responsable, en especial en Canarias.", "I.2.7": "Desarrollo de estilos de vida saludables relacionados con el bienestar físico del ser humano: alimentación variada, equilibrada y sostenible, higiene, ejercicio físico, contacto con la naturaleza, descanso y cuidado del cuerpo, uso adecuado de las tecnologías.", "I.2.8": "Desarrollo de estilos de vida saludables relacionados con el bienestar emocional y social: conciencia emocional (percepción, reconocimiento y comprensión emocional de alegría, tristeza, miedo, enfado, asco, sorpresa, culpa y vergüenza), regulación emocional (autocontrol impulsivo, ajuste afectivo y responsabilidad emocional) y vinculación emocional (empatía y comunicación emocional). Relaciones afectivas saludables, cuidados de las personas, corresponsabilidad e inclusión a partir de la educación afectivo-sexual, adaptada a su nivel madurativo.", "I.3.1": "Reconocimiento del calor como mecanismo de transferencia de energía. Cambios de estado, materiales conductores y aislantes, instrumentos de medición y aplicaciones en la vida cotidiana, mediante sencillas experiencias.", "I.3.2": "Observación de los cambios reversibles e irreversibles que experimenta la materia, desde un estado inicial a uno final, identificando los procesos y las transformaciones que experimenta en situaciones de la vida cotidiana.", "I.3.3": "Reconocimiento de las fuerzas de contacto y a distancia, y sus efectos, mediante experimentos elementales.", "I.3.4": "Reconocimiento de las propiedades de las máquinas simples, aplicaciones y usos en la vida cotidiana y su efecto sobre las fuerzas.", "II.1.1": "Utilización de dispositivos y recursos del entorno digital de aprendizaje, de acuerdo con las necesidades del contexto educativo.", "II.1.2": "Aplicación de las estrategias de búsquedas guiadas de información seguras y responsables en internet (valoración, discriminación, selección y organización). Reconocimiento de la autoría y respeto por la propiedad intelectual.", "II.1.3": "Uso de reglas básicas de seguridad y privacidad para navegar por internet y para proteger el entorno digital personal de aprendizaje.", "II.1.4": "Reconocimiento de recursos y participación en plataformas digitales restringidas y seguras, para comunicarse con otras personas y trabajar cooperativamente, haciendo uso de la etiqueta digital, de las reglas básicas de cortesía y respeto, y de estrategias para resolver problemas en la comunicación digital.", "II.1.5": "Desarrollo de estrategias de actuación para fomentar el bienestar digital, físico y mental, a través del reconocimiento de los riesgos asociados a un uso inadecuado y poco seguro de las tecnologías digitales (tiempo excesivo de uso, ciberacoso, acceso a contenidos inadecuados, publicidad y correos no deseados, etc.).", "II.2.1": "Aplicación de las fases de los proyectos de diseño: diseño, prototipado, prueba y comunicación, para dar respuestas sostenibles a un reto o problema del entorno físico, natural, social, cultural o tecnológico.", "II.2.2": "Utilización de herramientas, técnicas y materiales adecuados a la consecución de un proyecto de diseño.", "II.2.3": "Iniciación a la programación a través de recursos analógicos (actividades desenchufadas) y digitales (plataformas digitales de iniciación en la programación, aplicaciones de programación por bloques, robótica educativa…).", "II.2.4": "Desarrollo de técnicas cooperativas sencillas para el trabajo en equipo y estrategias para la gestión de conflictos y la promoción de conductas empáticas e inclusivas.", "III.1.1": "Descripción de la Tierra y las catástrofes naturales: elementos, movimientos, (traslación, rotación y sus consecuencias), dinámicas que ocurren en el universo y su relación con fenómenos físicos que afectan a la Tierra y repercuten en la vida diaria y en el entorno. Reconocimiento de la formación de las islas Canarias, tipos de vulcanismo e impacto en la vida de las personas.", "III.1.2": "Reconocimiento del espacio a partir de la representación de la Tierra a través del globo terráqueo, los mapas y otros recursos digitales, la interpretación de mapas y planos en distintas escalas y las técnicas de orientación mediante la observación de los elementos del medio físico, puntos cardinales y otros medios de localización espacial (GPS).", "III.1.3": "Reconocimiento del clima y el paisaje, los fenómenos atmosféricos, la toma y registro de datos meteorológicos y su representación gráfica y visual, desde las tecnologías de la información geográfica (TIG). Identificación de los tipos de clima en España y en Canarias, relacionando las zonas climáticas con la diversidad de paisajes.", "III.1.4": "Análisis de los principales problemas y retos demográficos mundiales y propios de la Comunidad Autónoma de Canarias, como la fragmentación del territorio por su carácter insular y las implicaciones del aislamiento del archipiélago. Reconocimiento de los factores que modifican la ocupación y distribución de la población en el espacio. Representación gráfica y cartográfica de la población. Reconocimiento de la organización del territorio en Canarias, en España y en Europa.", "III.1.5": "Conciencia de la desigualdad social y diferencias de acceso a los recursos. Usos del espacio por el ser humano y reconocimiento de las actividades productivas y su evolución, con especial atención a los sectores productivos en Canarias. El valor, el control del dinero y los medios de pago, de la supervivencia a la sobreproducción.", "III.2.1": "Adquisición de nociones básicas de tiempo histórico: temporales y cronología, mediante la ubicación temporal de las grandes etapas históricas.", "III.2.2": "Clasificación y utilización de las distintas fuentes históricas (orales, escritas, patrimoniales y museísticas), como vía para el análisis de los cambios y las permanencias en la localidad a lo largo de la historia. Reconocimiento de las huellas de la historia en lugares, edificios, objetos, oficios o tradiciones del municipio, isla o archipiélago.", "III.2.3": "Iniciación en la investigación y en los métodos de trabajo para la realización de proyectos, que analicen hechos, asuntos y temas de relevancia actual con perspectiva histórica, contextualizándolos en la época correspondiente (Prehistoria y Edad Antigua), como la supervivencia y la alimentación, la vivienda, los intercambios comerciales (de dónde viene el dinero, los trabajos no remunerados), la explotación de bienes comunes y recursos, o los avances técnicos.", "III.2.4": "Valoración de la acción de mujeres y hombres, como sujetos de la historia. Interpretación del papel de las personas individuales y de los distintos grupos sociales: relaciones, conflictos, creencias y condicionantes en la Prehistoria y la Edad Antigua.", "III.2.5": "Reconocimiento de las expresiones artísticas y culturales, en la Prehistoria y la Edad Antigua, su contextualización histórica y su función, visibilizando las aportaciones y la representación de las mujeres en ellas.", "III.2.6": "Valoración del patrimonio cultural y del natural local, insular y estatal. Uso, cuidado y conservación de los espacios protegidos, culturales y naturales, reconociendo los Parques Nacionales de Canarias.", "III.3.1": "Reconocimiento de las costumbres, tradiciones y manifestaciones etnoculturales del entorno; así como de la identidad cultural canaria, como resultado de un proceso de diálogo constante entre lo local y foráneo. Respeto por la diversidad y la cohesión social desde la promoción de la cultura de paz y no violencia.", "III.3.2": "Identificación de la organización política y territorial de España, partiendo del reconocimiento de la misma en Canarias.", "III.3.3": "Reconocimiento de la organización y el funcionamiento de la sociedad: las principales instituciones y entidades, la estructura administrativa y los servicios públicos que prestan en el entorno local, autonómico (los cabildos insulares como elemento intermedio entre los ayuntamientos y el gobierno autonómico) y nacional.", "III.3.4": "Fomento de la igualdad de oportunidades entre mujeres y hombres, y de conductas no sexistas. Reconocimiento del valor de mujeres referentes en el contexto del patrimonio social, cultural e histórico canario, y de las mujeres rurales de Canarias.", "III.3.5": "Conciencia de la seguridad vial, valorando la ciudad como espacio de convivencia inclusiva e igualitaria, a través de la adquisición de normas de circulación, la identificación de las señales y las marcas viales, y el desarrollo de la movilidad segura, saludable y sostenible como peatones o como personas usuarias de los medios de locomoción.", "III.4.1": "Introducción a las causas y consecuencias del cambio climático, y su impacto en los paisajes de la Tierra a nivel mundial y a nivel local en nuestro archipiélago. Medidas de mitigación y de adaptación.", "III.4.2": "Fomento de la responsabilidad ecosocial: ecodependencia e interdependencia entre personas, sociedades y medio natural.", "III.4.3": "Valoración de la transformación y la degradación de los ecosistemas naturales por la acción humana, y desarrollo de acciones para la conservación y protección de la naturaleza y la prevención del maltrato animal.", "III.4.4": "Reconocimiento de estilos de vida sostenibles: el consumo y la producción responsables, la alimentación sostenible, el uso eficiente del agua y la energía, y la prevención y la gestión de los residuos en Canarias."}}, "3": {"criterios": {"1.1": "Utilizar dispositivos y recursos digitales, de forma segura, responsable, eficiente, saludable y sostenible, de acuerdo con las necesidades del contexto educativo, para buscar información, evaluando su fiabilidad y utilidad, y respetando la propiedad intelectual, para comunicarse y compartir datos y contenido, en plataformas digitales restringidas y seguras, usando la terminología científica apropiada, y para trabajar cooperativamente en equipo y en red.", "1.2": "Reelaborar y crear contenidos digitales sencillos, de forma individual, en equipo y en red, para construir, comunicar y compartir nuevos conocimientos de forma creativa, y para resolver problemas concretos o retos, de acuerdo a las necesidades digitales del contexto educativo.", "2.1": "Formular preguntas y realizar predicciones razonadas sobre cuestiones científicas sencillas del medio natural, social y cultural, local y global, demostrando y manteniendo la curiosidad; y participar en interacciones comunicativas para intercambiar información, interpretar y valorar el sentido de diversos tipos de textos.", "2.2": "Buscar, seleccionar y contrastar información de diferentes fuentes, seguras y fiables, incluidas las digitales, de forma guiada, usando los criterios de fiabilidad de fuentes, adquiriendo léxico científico básico y utilizándola en investigaciones relacionadas con el medio natural, social y cultural.", "2.3": "Diseñar y realizar experimentos guiados, utilizando diferentes técnicas de indagación y modelos, empleando de forma segura las herramientas digitales, los instrumentos y dispositivos apropiados, realizando observaciones y mediciones precisas, y registrándolas correctamente.", "2.4": "Proponer posibles respuestas a las preguntas planteadas, en diversos textos, a través del análisis y la interpretación de la información y de los resultados obtenidos, valorar la coherencia de las posibles soluciones y compararlas con las predicciones realizadas.", "2.5": "Comunicar los resultados de las investigaciones, de manera creativa, personal y crítica, adaptando el mensaje y el formato a la audiencia a la que va dirigido, utilizando el lenguaje científico apropiado y explicando los pasos seguidos.", "3.1": "Plantear, cooperativamente, problemas de diseño que se resuelvan con la creación de un prototipo o solución digital sencilla y sostenible, evaluando las necesidades del entorno, adoptando posturas críticas en los procesos de reflexión guiados y estableciendo objetivos concretos y compartidos.", "3.2": "Diseñar posibles soluciones, creativas y sostenibles, a los problemas planteados, de acuerdo con técnicas sencillas de los proyectos de diseño y del pensamiento computacional, mediante estrategias básicas de gestión de proyectos cooperativos, teniendo en cuenta los recursos necesarios y estableciendo criterios concretos para participar en procesos de auto y coevaluación de los proyectos.", "3.3": "Desarrollar un producto final, creativo e innovador, que dé solución a un problema de diseño, probando en equipo diferentes prototipos o soluciones digitales, y utilizando, de forma segura, las herramientas, los dispositivos, las técnicas, los materiales y los recursos digitales adecuados.", "3.4": "Comunicar el diseño de un producto final, adaptando el mensaje y el formato a la audiencia, utilizando la terminología científica apropiada, explicando los pasos seguidos, valorando el proceso realizado y el resultado obtenido, justificando por qué ese prototipo o solución digital cumple con los requisitos del proyecto, y proponiendo posibles retos para futuros proyectos con iniciativa emprendedora.", "4.1": "Promover actitudes que fomenten el bienestar físico, emocional y social, reconociendo y tomando conciencia del propio cuerpo y de los cambios que conlleva la pubertad y la adolescencia, desde la percepción, el reconocimiento y la comprensión emocional, el autocontrol impulsivo, el ajuste afectivo y la responsabilidad emocional, la compensación emocional y la empatía y la comunicación emocional, para establecer relaciones afectivas y sociales saludables.", "4.2": "Adoptar estilos de vida saludables, aplicando el conocimiento científico y los principios de ética y seguridad, valorando la importancia de una alimentación variada, equilibrada y sostenible, la higiene, el ejercicio físico, el contacto con la naturaleza, el descanso, la prevención de enfermedades, los riesgos más relevantes para la salud y los usos de la tecnología y la gestión del tiempo libre, a través de la reflexión y el diálogo.", "5.1": "Identificar y analizar las características, la organización y las propiedades de los elementos del medio natural, social y cultural, partiendo de la biodiversidad del archipiélago canario, a través de la indagación, la búsqueda guiada de la información evaluando su fiabilidad y utilidad, y el pensamiento científico, utilizando las herramientas, los instrumentos y los procesos adecuados para transmitir y compartir los conocimientos en diferentes formatos.", "5.2": "Establecer conexiones sencillas entre diferentes elementos del medio natural, social y cultural, reconociendo la formación de las islas Canarias, mostrando comprensión de las relaciones sistémicas que se establecen entre las acciones humanas y el entorno, a nivel mundial y local.", "5.3": "Valorar, proteger y mostrar actitudes de conservación y mejora del patrimonio cultural y del natural, especialmente de Canarias, reconociendo las necesidades y los retos a afrontar, y diseñando propuestas y acciones que reflejen compromisos y conductas en favor de la sostenibilidad en el entorno cercano.", "6.1": "Promover y adoptar estilos de vida sostenibles y consecuentes con el respeto, los cuidados, la corresponsabilidad y la protección de las personas y del planeta, a partir del análisis de las causas y consecuencias de la intervención humana en el entorno, utilizando el pensamiento científico para favorecer un modelo de isla sostenible para Canarias.", "6.2": "Participar, con actitud emprendedora, en la búsqueda, el contraste y la evaluación de propuestas fundamentadas científicamente, para afrontar problemas ecosociales recogidos en los ODS y los retos de la Comunidad Autónoma de Canarias, buscar soluciones y actuar de manera individual y cooperativa en su resolución.", "7.1": "Analizar, adoptando una postura crítica, relaciones de causalidad, simultaneidad y sucesión entre diferentes elementos del medio social y cultural, desde la Edad Media hasta la actualidad, situando cronológicamente los hechos para comunicarlos, adoptando un punto de vista creativo.", "7.2": "Conocer personas, grupos sociales relevantes y formas de vida de las sociedades desde la Edad Media hasta la actualidad, identificando, seleccionando, contrastando la información y transmitiendo rasgos sociales significativos de las distintas épocas de la historia, visibilizando las aportaciones y representación de las mujeres en ellas, incluyendo la sociedad indígena canaria y su modo de vida.", "8.1": "Analizar los procesos geográficos, históricos y culturales que han conformado la sociedad actual y su reflejo en Canarias, valorando la diversidad cultural y la cohesión social, mostrando empatía y respeto por otras culturas, y apreciando la riqueza que aportan a la sociedad canaria.", "8.2": "Promover acciones para la igualdad efectiva entre mujeres y hombres, para evitar las conductas sexistas y para respetar la diversidad afectivo-sexual, analizando y contrastando diferentes modelos en nuestra sociedad, y reflexionando y aplicando las normas de convivencia de manera inclusiva.", "9.1": "Resolver, de forma pacífica y comunicativa, los conflictos, promoviendo una interacción respetuosa y equitativa, a partir del lenguaje inclusivo y no violento, explicando y ejercitando las principales normas, derechos, deberes y libertades que forman parte de la Constitución española de 1978, y de la Unión Europea, y reconociendo la función que el Estado y sus instituciones desempeñan en el mantenimiento de la paz, la seguridad integral ciudadana y el reconocimiento de las víctimas de violencia.", "9.2": "Explicar el funcionamiento general de los órganos de gobierno del municipio, de las comunidades autónomas, del Estado español y de la Unión Europea, valorando sus funciones y la gestión de los servicios públicos para la ciudadanía."}, "saberes": {"I.1.1": "Iniciación a la investigación científica (observación, formulación de preguntas y predicciones, diseño y realización de experimentos guiados, recogida y análisis de información y datos, comunicación de resultados…) para interpretar y explicar hechos y fenómenos que ocurren en el medio natural, social y cultural.", "I.1.2": "Fomento de la curiosidad, la iniciativa, la constancia y el sentido de la responsabilidad en la realización de las diferentes investigaciones a partir de estrategias cooperativas.", "I.1.3": "Utilización de instrumentos, dispositivos y herramientas digitales apropiados, para realizar observaciones y mediciones precisas de acuerdo con las necesidades de la investigación.", "I.1.4": "Uso del vocabulario científico apropiado relacionado con las diferentes investigaciones para comunicar, compartir y construir nuevos conocimientos.", "I.1.5": "Valoración de la ciencia, la tecnología y la ingeniería como actividades humanas: las profesiones STEM en la actualidad evitando estereotipos sexistas. Desarrollo de la ciencia en Canarias.", "I.1.6": "Reconocimiento de la relación entre los avances en matemáticas, ciencia, ingeniería y tecnología, y la evolución de la sociedad en el ámbito científico-tecnológico para divulgar esos conocimientos.", "I.2.1": "Clasificación básica de rocas y minerales. Usos y explotación sostenible de los recursos geológicos, especialmente en Canarias.", "I.2.2": "Identificación de los procesos geológicos básicos de formación y modelado del relieve, aplicando el conocimiento al medio natural canario. Reconocimiento de las particularidades geológicas de formación de las islas Canarias con respecto a otros procesos geológicos (tectónica, sedimentología, etc.).", "I.2.3": "Protección del entorno a partir del reconocimiento y la valoración de los principales ecosistemas y sus paisajes. Acercamiento a la fragilidad de los ecosistemas canarios y el impacto antrópico.", "I.2.4": "Descripción de las funciones vitales básicas del ser humano desde una perspectiva integrada: obtención de energía, relación con el entorno y perpetuación de la especie.", "I.2.5": "Reconocimiento de los cambios físicos, emocionales y sociales que conllevan la pubertad y la adolescencia, para favorecer su aceptación de forma positiva desde la educación afectivo-sexual, adaptada a su nivel madurativo.", "I.2.6": "Desarrollo de pautas para una alimentación saludable y sostenible: diseño de menús saludables, sostenibles y equilibrados. La importancia de la cesta de la compra y del etiquetado de los productos alimenticios para conocer sus nutrientes y su aporte energético.", "I.2.7": "Adopción de estilos de vida saludables a través de pautas que fomenten una salud física, emocional y social adecuadas: higiene del sueño, prevención y consecuencias del consumo de drogas (legales e ilegales), gestión saludable del ocio y del tiempo libre, contacto con la naturaleza, uso adecuado de las tecnologías.", "I.2.8": "Conocimiento de actuaciones básicas de primeros auxilios y pautas para la prevención de riesgos y accidentes.", "I.2.9": "Aplicación de estilos de vida saludables relacionados con el bienestar emocional y social: conciencia emocional (percepción, reconocimiento y comprensión emocional de alegría, tristeza, miedo, enfado, asco, sorpresa, culpa, vergüenza, ansiedad, seguridad y amor), regulación emocional (autocontrol impulsivo, ajuste afectivo y responsabilidad emocional), cambio emocional (compensación emocional) y vinculación emocional (empatía y comunicación emocional). Estrategias para el fomento de relaciones afectivas y sociales saludables y de los cuidados de las personas desde la corresponsabilidad e inclusión.", "I.3.1": "Utilización de instrumentos para calcular la masa, el volumen y la capacidad de un objeto. El concepto de densidad y su relación con la flotabilidad de un objeto en un líquido.", "I.3.2": "Identificación de las formas de energía, las fuentes y las transformaciones, describiendo las fuentes de energías renovables y no renovables, y su influencia en la contribución al desarrollo sostenible de la sociedad. Reconocimiento del modelo de isla sostenible en Canarias.", "I.3.3": "Uso en la vida cotidiana de la energía eléctrica: fuentes, transformaciones, transferencia, circuitos eléctricos y estructuras robotizadas.", "I.3.4": "Iniciación a los principios básicos del vuelo a través del conocimiento de diferentes artefactos voladores.", "II.1.1": "Utilización de dispositivos y recursos del entorno digital de aprendizaje de acuerdo con las necesidades del contexto educativo.", "II.1.2": "Aplicación de estrategias de búsqueda de información seguras, responsables y eficientes en internet (valoración, discriminación, selección y organización). Reconocimiento de la autoría y respeto por la propiedad intelectual.", "II.1.3": "Empleo de estrategias de recogida, almacenamiento y representación de datos en diversos formatos, para facilitar su comprensión y análisis.", "II.1.4": "Adopción de reglas básicas de seguridad y privacidad para navegar por internet y para proteger el entorno digital personal de aprendizaje.", "II.1.5": "Reconocimiento de recursos y participación en plataformas digitales restringidas y seguras para comunicarse con otras personas, trabajar cooperativamente, compartir datos y contenidos supervisados de manera segura, a partir del uso de la etiqueta digital, reglas básicas de cortesía y respeto, y estrategias para resolver problemas en la comunicación digital.", "II.1.6": "Desarrollo de estrategias de actuación para fomentar el bienestar digital físico y mental a través del reconocimiento de los riesgos asociados a un uso inadecuado y poco seguro de las tecnologías digitales (tiempo excesivo de uso, ciberacoso, dependencia tecnológica, acceso a contenidos inadecuados, etc.).", "II.2.1": "Aplicación de las fases de los proyectos de diseño: identificación de necesidades, diseño, prototipado, prueba, evaluación y comunicación, para dar respuesta a un reto o problema del entorno físico, natural, social, cultural o tecnológico.", "II.2.2": "Utilización de herramientas, dispositivos, técnicas, materiales y recursos digitales (programación por bloques, sensores, motores, simuladores, impresoras 3D…), seguros y adecuados a la consecución del proyecto.", "II.2.3": "Aplicación de las fases del pensamiento computacional (descomposición de una tarea en partes más sencillas, reconocimiento de patrones y creación de algoritmos sencillos para la resolución…) para dar respuesta a un reto o problema del entorno físico, natural, social, cultural o tecnológico, de forma sostenible.", "II.2.4": "Desarrollo de estrategias creativas en situaciones de incertidumbre (detección de necesidades y oportunidades, adaptación y cambio de propuesta cuando sea necesario, valoración del error propio y ajeno como fuente de aprendizaje, valoración de la diversidad como enriquecimiento en el desempeño cooperativo).", "III.1.1": "Análisis del futuro de la Tierra y del universo a través de la identificación de los fenómenos físicos y su repercusión en la vida diaria y en el entorno, la exploración espacial, la observación del cielo en Canarias y la contaminación lumínica.", "III.1.2": "Explicación del cambio climático: introducción a la dinámica atmosférica y a las grandes áreas climáticas del mundo.", "III.1.3": "Valoración del entorno natural, de la diversidad geográfica de la España continental e insular, y de Europa. Representación gráfica, visual y cartográfica a través de medios y recursos analógicos y digitales, usando las Tecnologías de la Información Geográfica (TIG).", "III.1.4": "Conocimiento y aprecio de la diversidad cultural, y en especial en el entorno insular, a través del análisis de los movimientos migratorios, teniendo en cuenta particularmente los que afectan a Canarias; las principales variables demográficas y su representación gráfica; los comportamientos de la población y su evolución; el contraste entre zonas urbanas y despoblación rural.", "III.1.5": "Desarrollo de la ciudadanía activa: fundamentos y principios para la organización política y gestión del territorio en España, y para la participación social y ciudadana europea, nacional y local.", "III.1.6": "Promoción de la igualdad y conductas no sexistas, a través del desarrollo del pensamiento crítico de los estereotipos y roles en los distintos ámbitos (académico, profesional, social y cultural), y de acciones para la igualdad efectiva entre mujeres y hombres, valorando las mujeres referentes en el contexto del patrimonio social, cultural e histórico canario, y de las mujeres rurales de Canarias.", "III.1.7": "Identificación y aplicación de estrategias para el desarrollo universal: inclusión, equidad y accesibilidad.", "III.2.1": "Clasificación y utilización de las distintas fuentes históricas (orales, escritas, patrimoniales y museísticas), para identificar y relacionar las acciones y hechos más destacados en la historia (Edad Media, Edad Moderna y Edad Contemporánea), así como el papel representado por los sujetos históricos (individuales y colectivos), acontecimientos y procesos. La sociedad indígena canaria y su modo de vida y la conquista de las islas Canarias.", "III.2.2": "Valoración de los principales movimientos en defensa de los derechos de las mujeres, analizando la situación actual y los retos de futuro en la igualdad de oportunidades entre mujeres y hombres, a nivel mundial, nacional y en Canarias.", "III.2.3": "Importancia de la memoria democrática: análisis multicausal del proceso de construcción de la democracia en España, la constitución española de 1978 y fórmulas para la participación de la ciudadanía en la vida pública.", "III.2.4": "Identificación de las expresiones artísticas y culturales medievales, modernas y contemporáneas, su contextualización histórica, y su reflejo en Canarias. La función del arte y la cultura en el mundo medieval, moderno y contemporáneo, visibilizando las aportaciones y representación de las mujeres.", "III.2.5": "Valoración del patrimonio cultural y natural de las islas Canarias, como bien y recurso; su uso, cuidado y conservación. Aprecio por la herencia cultural local, nacional y europea.", "III.3.1": "Reconocimiento de la diversidad cultural y lingüística de España, valorando especialmente el español de Canarias como variedad de prestigio adecuada a todas las situaciones comunicativas. Respeto y valoración de la historia y cultura de minorías étnicas presentes en nuestro país, particularmente las propias del pueblo gitano.", "III.3.2": "Reflexión y análisis de los principios y valores de los derechos humanos y de la infancia y la Constitución española de 1978, derechos y deberes de la ciudadanía así como de la contribución del Estado y sus instituciones, nacionales y locales, a la paz, la seguridad integral y la cooperación internacional para el desarrollo democrático.", "III.3.3": "Aplicación de la cultura de paz y no violencia a través del pensamiento crítico como herramienta para el análisis de los conflictos de intereses y el reconocimiento de las víctimas de la violencia.", "III.3.4": "Reconocimiento de la organización política: las principales entidades políticas y administrativas del entorno local, autonómico y nacional en España, sistemas de representación y de participación política.", "III.3.5": "Reconocimiento de las principales instituciones de España y de la Unión Europea, de sus valores, de sus funciones, de sus ámbitos de acción y su repercusión en el entorno cercano.", "III.4.1": "Análisis del cambio climático, de Canarias al mundo: causas, consecuencias, medidas de mitigación y adaptación.", "III.4.2": "Fomento de la responsabilidad ecosocial: ecodependencia, interdependencia e interrelación entre personas, sociedades y medio natural.", "III.4.3": "Reflexión sobre el desarrollo sostenible, el
